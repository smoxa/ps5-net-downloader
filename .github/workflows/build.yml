name: Build PS5 ELF Payload

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Toolchain Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            lld \
            llvm \
            llvm-dev \
            unzip \
            curl \
            python3 \
            python3-pyelftools

      - name: Setup ps5-payload-sdk
        run: |
          curl -sL -o /tmp/ps5-payload-sdk.zip https://github.com/ps5-payload-dev/sdk/releases/latest/download/ps5-payload-sdk.zip
          unzip -q /tmp/ps5-payload-sdk.zip -d $HOME
          chmod +x $HOME/ps5-payload-sdk/bin/*

          # Find absolute path of llvm-config
          LLVM_CONF_BIN="$(command -v llvm-config-18 || command -v llvm-config)"
          echo "Found LLVM config at: ${LLVM_CONF_BIN}"
          echo "LLVM_CONFIG=${LLVM_CONF_BIN}" >> $GITHUB_ENV

          # Replace prospero-llvm-config with direct absolute execution to prevent readlink -f relative path resolution bug
          cat << EOF > $HOME/ps5-payload-sdk/bin/prospero-llvm-config
          #!/usr/bin/env bash
          exec "${LLVM_CONF_BIN}" "\$@"
          EOF
          chmod +x $HOME/ps5-payload-sdk/bin/prospero-llvm-config

          # Ensure clang and clang++ shims route cleanly to host llvm binaries
          cat << 'EOF' > $HOME/ps5-payload-sdk/bin/clang
          #!/usr/bin/env bash
          LLVM_BINDIR=$($(dirname "$0")/prospero-llvm-config --bindir 2>/dev/null)
          if [ -n "$LLVM_BINDIR" ] && [ -f "$LLVM_BINDIR/clang" ]; then
              exec "$LLVM_BINDIR/clang" "$@"
          fi
          exec clang "$@"
          EOF
          chmod +x $HOME/ps5-payload-sdk/bin/clang

          cat << 'EOF' > $HOME/ps5-payload-sdk/bin/clang++
          #!/usr/bin/env bash
          LLVM_BINDIR=$($(dirname "$0")/prospero-llvm-config --bindir 2>/dev/null)
          if [ -n "$LLVM_BINDIR" ] && [ -f "$LLVM_BINDIR/clang++" ]; then
              exec "$LLVM_BINDIR/clang++" "$@"
          fi
          exec clang++ "$@"
          EOF
          chmod +x $HOME/ps5-payload-sdk/bin/clang++

          echo "PS5_PAYLOAD_SDK=$HOME/ps5-payload-sdk" >> $GITHUB_ENV
          echo "$HOME/ps5-payload-sdk/bin" >> $GITHUB_PATH

      - name: Setup PacBrew Dependencies (libcurl, OpenSSL)
        run: |
          mkdir -p /tmp/pacbrew/out
          curl -sL -o /tmp/pacbrew/ps5-payload-dev.tar.gz https://github.com/ps5-payload-dev/pacbrew-repo/releases/download/v0.40.2/ps5-payload-dev.tar.gz
          tar -xzf /tmp/pacbrew/ps5-payload-dev.tar.gz -C /tmp/pacbrew/out
          HBREW_SRC=$(find /tmp/pacbrew/out -type d -name "homebrew" | head -n 1)
          echo "Found homebrew at: $HBREW_SRC"
          mkdir -p $HOME/ps5-payload-sdk/target/user/homebrew
          cp -r $HBREW_SRC/* $HOME/ps5-payload-sdk/target/user/homebrew/
          ls -lh $HOME/ps5-payload-sdk/target/user/homebrew/lib/libcurl.a
          ls -lh $HOME/ps5-payload-sdk/target/user/homebrew/include/curl/curl.h

      - name: Build Net Downloader ELF
        run: |
          set -e
          make PS5_PAYLOAD_SDK=$HOME/ps5-payload-sdk
          ls -lh ps5-net-downloader.elf

      - name: Upload ELF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps5-net-downloader-elf
          path: ps5-net-downloader.elf
          if-no-files-found: error

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ps5-net-downloader.elf
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
